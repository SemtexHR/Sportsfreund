info:
  name: user-erstellen
  type: http
  seq: 1

http:
  method: POST
  url: /api/user
  body:
    type: json
    data: |-
      {
        "username": "max.mustermann",
        "password": "geheim123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Nutzer registrieren

  Erstellt einen neuen Nutzer. Dieser Endpunkt benötigt keinen Token.

  ## Request

  **Methode:** POST

  **URL:** `/api/user`

  ## Headers

  | Header | Wert |
  |---|---|
  | Content-Type | application/json |
  | Accept | application/json |

  ## Body-Parameter

  | Parameter | Typ | Pflicht | Beschreibung |
  |---|---|---|---|
  | username | string | Ja | Benutzername |
  | password | string | Ja | Passwort des Nutzers |

  **Beispiel:**

  ```json
  {
    "username": "max.mustermann",
    "password": "geheim123"
  }
  ```

  ## Responses

  ### 201 Created – Erfolgreich

  Der Nutzer wurde erstellt.

  ```json
  {
    "success": true,
    "message": "Nutzer erstellt"
  }
  ```

  ### 400 Bad Request – Ungültige Parameter

  ```json
  {
    "success": false,
    "error": "Ungültige Parameter"
  }
  ```

  ### 409 Conflict – Username bereits vergeben

  ```json
  {
    "success": false,
    "error": "Username bereits vergeben"
  }
  ```

  ### 500 Internal Server Error – Nutzer konnte nicht erstellt werden

  ```json
  {
    "success": false,
    "error": "Der Nutzer konnte nicht erstellt werden"
  }
  ```
