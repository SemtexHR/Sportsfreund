docs: |-
  # Anwesenheiten abfragen

  Liefert die Anzahl der eingetragenen Sportler für einen bestimmten Sportplatz zu einer bestimmten Uhrzeit.

  ## Request

  **Methode:** GET

  **URL:** `/api/anwesenheit`

  ## Query-Parameter

  | Parameter | Typ | Pflicht | Beschreibung |
  |---|---|---|---|
  | id | number | Ja | ID des Sportplatzes |
  | zeit | string | Nein | Zeitpunkt als ISO 8601 Zeitstempel (z. B. `2026-11-03T17:00:00Z`). Standard: aktuelle Zeit |

  ## Headers

  | Header | Wert |
  |---|---|
  | Accept | application/json |
  | Authorization | Bearer Token |

  ## Responses

  ### 200 OK – Erfolgreich

  Gibt die Anzahl der anwesenden Personen für den Sportplatz zum angefragten Zeitpunkt zurück.

  ```json
  {
    "success": true,
    "data": {
      "id": 1,
      "zeit": "2026-11-03T17:00:00Z",
      "personen": 5
    }
  }
  ```

  ### 400 Bad Request – Ungültige Parameter

  ```json
  {
    "success": false,
    "error": "Ungültige Parameter"
  }
  ```

  ### 401 Unauthorized – Token fehlt oder ungültig

  ```json
  {
    "success": false,
    "error": "Nicht autorisiert"
  }
  ```

  ### 404 Not Found – Sportplatz nicht gefunden

  ```json
  {
    "success": false,
    "error": "Sportplatz nicht gefunden"
  }
  ```
