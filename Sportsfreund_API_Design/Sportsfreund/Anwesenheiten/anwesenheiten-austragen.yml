docs: |-
  # Anwesenheit austragen

  Entfernt eine bestehende Anwesenheit des angemeldeten Nutzers von einem Sportplatz. Der Nutzer wird anhand des Tokens bestimmt.

  ## Request

  **Methode:** DELETE

  **URL:** `/api/anwesenheit`

  ## Query-Parameter

  | Parameter | Typ | Pflicht | Beschreibung |
  |---|---|---|---|
  | sportplatz_id | number | Ja | ID des Sportplatzes |
  | von | string | Ja | Beginn der einzutragenden Anwesenheit als ISO 8601 Zeitstempel |
  | bis | string | Ja | Ende der eingetragenen Anwesenheit als ISO 8601 Zeitstempel |

  ## Headers

  | Header | Wert |
  |---|---|
  | Accept | application/json |
  | Authorization | Bearer Token |

  ## Responses

  ### 200 OK – Erfolgreich

  Die Anwesenheit wurde entfernt.

  ```json
  {
    "success": true,
    "message": "Anwesenheit erfolgreich ausgetragen"
  }
  ```

  ### 400 Bad Request – Ungültige Parameter

  ```json
  {
    "success": false,
    "error": "Ungültige Parameter"
  }
  ```

  ### 401 Unauthorized – Token fehlt oder ungültig

  ```json
  {
    "success": false,
    "error": "Nicht autorisiert"
  }
  ```

  ### 404 Not Found – Sportplatz oder Anwesenheit nicht gefunden

  ```json
  {
    "success": false,
    "error": "Sportplatz oder Anwesenheit nicht gefunden"
  }
  ```
